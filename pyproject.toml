[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conduit"
version = "0.1.0"
description = "Batch ETL for NYC 311 service requests: bronze, silver, gold, with a data-quality gate."
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "pyarrow",
    "requests",
    "click",
    "matplotlib",
]

[project.scripts]
conduit = "conduit.cli:main"

[tool.setuptools]
packages = ["conduit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
